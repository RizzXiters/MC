<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>RizzCraft</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:5;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 2px #000;
}

#crosshair:before{
  width:2px;
  height:18px;
  left:8px;
}

#crosshair:after{
  width:18px;
  height:2px;
  top:8px;
}

#hotbar{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:5px;
  padding:6px;
  background:rgba(0,0,0,.45);
  border:2px solid rgba(255,255,255,.35);
  border-radius:7px;
  z-index:10;
}

.slot{
  width:52px;
  height:52px;
  background:#333;
  border:3px solid #777;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.slot.selected{
  border-color:white;
  box-shadow:0 0 0 2px #777;
}

.slot canvas{
  width:38px;
  height:38px;
  image-rendering:pixelated;
}

.number{
  position:absolute;
  left:3px;
  top:2px;
  color:white;
  font-size:12px;
  text-shadow:1px 1px #000;
}

#info{
  position:fixed;
  left:12px;
  top:12px;
  color:white;
  text-shadow:2px 2px 3px #000;
  z-index:10;
  font-size:14px;
}

#mobile{
  display:none;
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
}

.touchButton{
  pointer-events:auto;
  width:62px;
  height:62px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.35);
  color:white;
  font-size:25px;
}

#leftControls{
  position:absolute;
  left:20px;
  bottom:100px;
  display:grid;
  grid-template-columns:62px 62px 62px;
  gap:5px;
}

#leftControls button{
  visibility:hidden;
}

#leftControls .show{
  visibility:visible;
}

#rightControls{
  position:absolute;
  right:20px;
  bottom:100px;
  display:flex;
  gap:10px;
}

@media(max-width:800px){
  #mobile{
    display:block;
  }

  #info{
    font-size:12px;
  }

  .slot{
    width:43px;
    height:43px;
  }

  .slot canvas{
    width:31px;
    height:31px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="crosshair"></div>

<div id="info">
  <b>RIZZCRAFT</b><br>
  WASD = jalan | Mouse = lihat<br>
  Klik kiri = hancurkan | Klik kanan = pasang
</div>

<div id="hotbar"></div>

<div id="mobile">

  <div id="leftControls">
    <button class="touchButton show" id="up">▲</button>
    <button class="touchButton" id="dummy1"></button>
    <button class="touchButton" id="dummy2"></button>

    <button class="touchButton show" id="left">◀</button>
    <button class="touchButton show" id="down">▼</button>
    <button class="touchButton show" id="right">▶</button>
  </div>

  <div id="rightControls">
    <button class="touchButton" id="breakBtn">⛏</button>
    <button class="touchButton" id="placeBtn">＋</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   RIZZCRAFT
   Minecraft-style voxel prototype
   ========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
  0x87ceeb,
  25,
  90
);


/* =========================================================
   CAMERA
   ========================================================= */

const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.05,
  200
);

camera.position.set(0, 4, 8);


/* =========================================================
   RENDERER
   ========================================================= */

const renderer = new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio, 1.5)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
   ========================================================= */

const hemi = new THREE.HemisphereLight(
  0xbfe8ff,
  0x665544,
  1.6
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2
);

sun.position.set(
  40,
  80,
  30
);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

scene.add(sun);


/* =========================================================
   PIXEL TEXTURES
   ========================================================= */

function textureBase(type){

  const c = document.createElement("canvas");

  c.width = 16;
  c.height = 16;

  const ctx = c.getContext("2d");

  ctx.imageSmoothingEnabled = false;

  let base;

  if(type==="grass")
    base="#55a83b";

  if(type==="dirt")
    base="#8b5a2b";

  if(type==="stone")
    base="#777";

  if(type==="wood")
    base="#85572e";

  if(type==="leaves")
    base="#3f8c35";

  if(type==="sand")
    base="#d9c27a";

  if(type==="water")
    base="#3d91d1";

  ctx.fillStyle=base;
  ctx.fillRect(0,0,16,16);


  /* pixel noise */

  for(let i=0;i<45;i++){

    const x=Math.floor(Math.random()*16);
    const y=Math.floor(Math.random()*16);

    let color;

    if(type==="grass")
      color=Math.random()>.5 ? "#478c32" : "#69b84a";

    else if(type==="dirt")
      color=Math.random()>.5 ? "#74481f" : "#a66d35";

    else if(type==="stone")
      color=Math.random()>.5 ? "#666" : "#888";

    else if(type==="wood")
      color=Math.random()>.5 ? "#69431f" : "#9a6838";

    else if(type==="leaves")
      color=Math.random()>.5 ? "#34732d" : "#55a746";

    else if(type==="sand")
      color=Math.random()>.5 ? "#c5ad68" : "#ead58e";

    else
      color=Math.random()>.5 ? "#327eb8" : "#54a5df";

    ctx.fillStyle=color;

    ctx.fillRect(x,y,1,1);
  }


  /* grass highlights */

  if(type==="grass"){

    ctx.fillStyle="#71bf4d";

    for(let i=0;i<8;i++){

      const x=Math.floor(Math.random()*16);

      ctx.fillRect(x,0,1,2);
    }
  }


  const tex = new THREE.CanvasTexture(c);

  tex.magFilter=THREE.NearestFilter;
  tex.minFilter=THREE.NearestFilter;

  return tex;
}


const textures={};

[
  "grass",
  "dirt",
  "stone",
  "wood",
  "leaves",
  "sand",
  "water"
].forEach(type=>{
  textures[type]=textureBase(type);
});


/* =========================================================
   MATERIALS
   ========================================================= */

const materials={};

for(const type in textures){

  materials[type]=new THREE.MeshLambertMaterial({
    map:textures[type],
    transparent:type==="water",
    opacity:type==="water" ? .75 : 1
  });

}


/* =========================================================
   BLOCKS
   ========================================================= */

const blocks=new Map();

const SIZE=1;

function key(x,y,z){

  return `${x},${y},${z}`;
}


function addBlock(x,y,z,type){

  const k=key(x,y,z);

  if(blocks.has(k))
    return;

  const geo=new THREE.BoxGeometry(
    SIZE,
    SIZE,
    SIZE
  );

  const mesh=new THREE.Mesh(
    geo,
    materials[type]
  );

  mesh.position.set(
    x,
    y,
    z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  mesh.userData={
    x,
    y,
    z,
    type
  };

  scene.add(mesh);

  blocks.set(k,mesh);
}


function removeBlock(x,y,z){

  const k=key(x,y,z);

  const block=blocks.get(k);

  if(!block)
    return;

  scene.remove(block);

  block.geometry.dispose();

  blocks.delete(k);
}


/* =========================================================
   WORLD GENERATION
   ========================================================= */

function heightAt(x,z){

  const h =
    2 +
    Math.sin(x*.18)*1.3 +
    Math.cos(z*.15)*1.2 +
    Math.sin((x+z)*.08)*1.4;

  return Math.max(
    1,
    Math.floor(h)
  );
}


const WORLD=24;

for(let x=-WORLD;x<=WORLD;x++){

  for(let z=-WORLD;z<=WORLD;z++){

    const h=heightAt(x,z);

    for(let y=0;y<=h;y++){

      let type="dirt";

      if(y===0)
        type="stone";

      else if(y===h)
        type="grass";

      else if(y<h-3)
        type="stone";

      addBlock(
        x,
        y,
        z,
        type
      );
    }


    /* trees */

    if(
      Math.abs(x)>3 &&
      Math.abs(z)>3 &&
      Math.random()<0.025 &&
      h>=2
    ){

      const trunk=h+1;

      for(let y=1;y<=4;y++){

        addBlock(
          x,
          h+y,
          z,
          "wood"
        );
      }


      for(
        let dx=-2;
        dx<=2;
        dx++
      ){

        for(
          let dz=-2;
          dz<=2;
          dz++
        ){

          for(
            let dy=3;
            dy<=5;
            dy++
          ){

            if(
              Math.abs(dx)+
              Math.abs(dz)<4
            ){

              addBlock(
                x+dx,
                h+dy,
                z+dz,
                "leaves"
              );

            }

          }

        }

      }

    }

  }

}


/* =========================================================
   PLAYER
   ========================================================= */

const player={
  velocity:new THREE.Vector3(),
  speed:5,
  gravity:18,
  height:1.7,
  onGround:false
};


camera.position.y =
  heightAt(0,8)+2.2;


/* =========================================================
   INPUT
   ========================================================= */

const keys={};

addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;

    if(
      e.code.startsWith("Digit")
    ){

      const n=
        Number(
          e.code.replace("Digit","")
        )-1;

      if(
        n>=0 &&
        n<hotbar.length
      ){

        selected=n;
        updateHotbar();

      }

    }

  }
);

addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


/* =========================================================
   MOUSE LOOK
   ========================================================= */

let yaw=0;
let pitch=0;

renderer.domElement.addEventListener(
  "click",
  ()=>{
    if(innerWidth>800)
      renderer.domElement.requestPointerLock();
  }
);

document.addEventListener(
  "mousemove",
  e=>{

    if(
      document.pointerLockElement !==
      renderer.domElement
    )
      return;

    yaw-=e.movementX*.0025;
    pitch-=e.movementY*.0025;

    pitch=Math.max(
      -Math.PI/2+.05,
      Math.min(
        Math.PI/2-.05,
        pitch
      )
    );

  }
);


/* =========================================================
   HOTBAR
   ========================================================= */

const hotbar=[
  "grass",
  "dirt",
  "stone",
  "wood",
  "leaves",
  "sand",
  "water"
];

let selected=0;

const hotbarElement=
  document.getElementById("hotbar");


function updateHotbar(){

  hotbarElement.innerHTML="";

  hotbar.forEach(
    (type,i)=>{

      const slot=
        document.createElement("div");

      slot.className=
        "slot"+
        (i===selected ?
          " selected":"");

      const num=
        document.createElement("span");

      num.className="number";

      num.textContent=i+1;

      slot.appendChild(num);


      const canvas=
        document.createElement("canvas");

      canvas.width=16;
      canvas.height=16;

      const ctx=
        canvas.getContext("2d");

      ctx.drawImage(
        textures[type].image,
        0,0
      );

      slot.appendChild(canvas);

      slot.addEventListener(
        "click",
        ()=>{
          selected=i;
          updateHotbar();
        }
      );

      hotbarElement.appendChild(slot);

    }
  );

}

updateHotbar();


/* =========================================================
   RAYCAST
   ========================================================= */

const raycaster=
  new THREE.Raycaster();

raycaster.far=7;


function getTarget(){

  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );

  const objects=
    [...blocks.values()];

  const hits=
    raycaster.intersectObjects(
      objects,
      false
    );

  return hits.length ?
    hits[0] :
    null;
}


/* =========================================================
   BREAK BLOCK
   ========================================================= */

function breakBlock(){

  const hit=getTarget();

  if(!hit)
    return;

  const b=hit.object.userData;

  if(b.y<=0)
    return;

  removeBlock(
    b.x,
    b.y,
    b.z
  );
}


/* =========================================================
   PLACE BLOCK
   ========================================================= */

function placeBlock(){

  const hit=getTarget();

  if(!hit)
    return;

  const b=
    hit.object.userData;

  const normal=
    hit.face.normal;

  const x=
    Math.round(
      b.x+normal.x
    );

  const y=
    Math.round(
      b.y+normal.y
    );

  const z=
    Math.round(
      b.z+normal.z
    );

  const k=key(x,y,z);

  if(blocks.has(k))
    return;

  addBlock(
    x,
    y,
    z,
    hotbar[selected]
  );
}


renderer.domElement.addEventListener(
  "mousedown",
  e=>{

    if(e.button===0)
      breakBlock();

    if(e.button===2)
      placeBlock();

  }
);

renderer.domElement.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);


/* =========================================================
   MOVEMENT
   ========================================================= */

function movement(dt){

  const direction=
    new THREE.Vector3();

  if(keys.KeyW)
    direction.z-=1;

  if(keys.KeyS)
    direction.z+=1;

  if(keys.KeyA)
    direction.x-=1;

  if(keys.KeyD)
    direction.x+=1;


  if(direction.length()>0)
    direction.normalize();


  const forward=
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  const move=
    new THREE.Vector3();

  move.addScaledVector(
    forward,
    direction.z
  );

  move.addScaledVector(
    right,
    direction.x
  );


  if(move.length()>0)
    move.normalize();


  camera.position.x +=
    move.x *
    player.speed *
    dt;

  camera.position.z +=
    move.z *
    player.speed *
    dt;


  /* gravity */

  player.velocity.y -=
    player.gravity*dt;

  camera.position.y +=
    player.velocity.y*dt;


  const ground=
    heightAt(
      Math.round(camera.position.x),
      Math.round(camera.position.z)
    )+1.7;


  if(camera.position.y<ground){

    camera.position.y=
      ground;

    player.velocity.y=0;

    player.onGround=true;

  }


  if(
    keys.Space &&
    player.onGround
  ){

    player.velocity.y=7;

    player.onGround=false;

  }

}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(){

  camera.rotation.order="YXZ";

  camera.rotation.y=yaw;

  camera.rotation.x=pitch;

}


/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

function holdButton(
  id,
  key
){

  const button=
    document.getElementById(id);

  button.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      keys[key]=true;
    },
    {passive:false}
  );

  button.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      keys[key]=false;
    },
    {passive:false}
  );

}


holdButton("up","KeyW");
holdButton("down","KeyS");
holdButton("left","KeyA");
holdButton("right","KeyD");


document
  .getElementById("breakBtn")
  .addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      breakBlock();
    },
    {passive:false}
  );


document
  .getElementById("placeBtn")
  .addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      placeBlock();
    },
    {passive:false}
  );


/* =========================================================
   MOBILE LOOK
   ========================================================= */

let touchX=null;
let touchY=null;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    if(e.touches.length!==1)
      return;

    touchX=e.touches[0].clientX;
    touchY=e.touches[0].clientY;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchmove",
  e=>{

    if(
      touchX===null ||
      e.touches.length!==1
    )
      return;

    const x=
      e.touches[0].clientX;

    const y=
      e.touches[0].clientY;

    const dx=x-touchX;
    const dy=y-touchY;

    yaw-=dx*.006;
    pitch-=dy*.006;

    pitch=Math.max(
      -1.5,
      Math.min(
        1.5,
        pitch
      )
    );

    touchX=x;
    touchY=y;

  },
  {passive:true}
);


renderer.domElement.addEventListener(
  "touchend",
  ()=>{
    touchX=null;
    touchY=null;
  }
);


/* =========================================================
   RESIZE
   ========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   GAME LOOP
   ========================================================= */

let previous=
  performance.now();


function animate(){

  requestAnimationFrame(
    animate
  );

  const now=
    performance.now();

  const dt=
    Math.min(
      (now-previous)/1000,
      .05
    );

  previous=now;

  movement(dt);

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
